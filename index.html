<script>
'use strict';
// Basit form ayrıştırıcı: "Etiket: değer" satırları. Tarih satırı yeni gün başlatır.
const DATE_RE = /(\d{1,2})[./-](\d{1,2})[./-](\d{4})/;
const DAYS_TR = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const LABELS = { 'çorba': 'Çorba', 'ana yemek': 'Ana Yemek', 'yan yemek': 'Yan Yemek', 'ek': 'Tamamlayıcı' };
const pad = (n) => String(n).padStart(2, '0');
const clean = (s) => String(s || '').replace(/[\u00a0\u200b\ufeff]/g, ' ').replace(/\s+/g, ' ').trim();

function dayNameOf(dateStr) {
  const [d, m, y] = dateStr.split('.').map(Number);
  return DAYS_TR[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
}

// "Orman Kebabı (Bahçeköy Yerleşkesi)" -> { name: "Orman Kebabı", note: "Bahçeköy Yerleşkesi" }
function splitNote(raw) {
  const notes = [];
  const name = clean(raw.replace(/\(([^)]*)\)?/g, (_, n) => { if (clean(n)) notes.push(clean(n)); return ' '; }));
  return { name, note: notes.join(' · ') };
}

function parseMenu(text) {
  const menus = {};
  let cur = null;
  const finish = () => { if (cur && cur.meals.length) menus[cur.date] = cur; cur = null; };
  for (const raw of String(text).split(/\r?\n/)) {
    const line = clean(raw);
    if (!line || line.startsWith('#')) continue;
    const m = line.match(/^([^:]+):\s*(.*)$/);
    if (!m) continue;
    const key = m[1].trim().toLocaleLowerCase('tr'), val = clean(m[2]);
    if (key === 'tarih') {
      finish();
      const d = val.match(DATE_RE);
      if (d) { const date = `${pad(d[1])}.${pad(d[2])}.${d[3]}`; cur = { date, dayName: dayNameOf(date), meals: [], calories: '' }; }
    } else if (cur && key === 'kalori') {
      const n = parseInt(val.replace(/\D/g, ''), 10);
      cur.calories = n > 0 ? `${n} Kalori` : '';
    } else if (cur && LABELS[key] && val) {
      const { name, note } = splitNote(val);
      if (name) cur.meals.push({ name, category: LABELS[key], note });
    }
  }
  finish();
  return menus;
}

const api = { parseMenu, dayNameOf };
if (typeof module !== 'undefined' && module.exports) module.exports = api; else window.MenuParse = api;
</script>

  function icon(n) {
    const s = n.toLowerCase();
    const map = [[/çorba|şorba/, '🥣'], [/balık|hamsi|somon|levrek/, '🐟'], [/tavuk|piliç|şnitzel/, '🍗'], [/köfte|kebap|kebab|et\b|etli|kıyma|dana|kuzu|sote|güveç|döner/, '🥩'],
      [/pilav|bulgur|pirinç/, '🍚'], [/makarna|spagetti|erişte|noodle|mantı/, '🍝'], [/patates|püre/, '🥔'], [/salata|cacık/, '🥗'],
      [/ayran|yoğurt|süt\b/, '🥛'], [/tatlı|sütlaç|helva|baklava|puding|kek|revani/, '🍮'], [/meyve|elma|portakal|mandalina|muz/, '🍎'],
      [/nohut|fasulye|mercimek|barbunya|kuru/, '🫘'], [/börek|poğaça|pide|lahmacun/, '🥟'], [/sebze|ıspanak|kabak|patlıcan|biber|bezelye|enginar/, '🥬'], [/ekmek/, '🍞']];
    for (const [re, e] of map) if (re.test(s)) return e;
    return '🍽️';
  }

  function renderStrip() {
    const today = istanbulNow().key, strip = $('strip');
    strip.replaceChildren();
    DOW.forEach((label, i) => {
      const k = addDays(weekStart, i);
      const b = el('button', 'day' + (k === selected ? ' sel' : '') + (k === today ? ' today' : '') + (menus[k] ? '' : ' empty-day'));
      b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', k === selected);
      b.append(el('small', '', label), el('b', '', String(+k.slice(0, 2))));
      b.onclick = () => { selected = k; rerouted = false; render(); };
      strip.append(b);
    });
    $('prevWeek').disabled = !weekOk(-1);
    $('nextWeek').disabled = !weekOk(1);
  }

  function emptyMessage() {
    if (typeof location !== 'undefined' && location.protocol === 'file:') return 'Sayfa dosyadan açılmış, menü okunamaz. Proje klasöründe "npx serve" çalıştırıp çıkan adresi aç.';
    if (rawText == null) return loading ? 'Yükleniyor…' : `Menü yüklenemedi (${loadInfo || 'bilinmeyen hata'}).`;
    if (/^(<{7}|>{7})/m.test(rawText)) return 'data/menu.txt içinde Git çakışma işaretleri (<<<<<<<) var, temizlenmeli.';
    if (!keys().length) return `menu.txt okundu ama dolu gün bulunamadı (${(rawText.match(/^\s*Tarih:/gim) || []).length} tarih satırı). Yemekleri iki noktadan sonra yaz.`;
    return 'Bu gün için menü yayınlanmadı.';
  }

  function renderMenu() {
    const m = menus[selected], list = $('list');
    list.replaceChildren();
    $('dayTitle').textContent = `${longDate(selected)} ${DAYS[dow(selected)]}`;
    $('kcal').hidden = !(m && m.calories);
    if (m && m.calories) $('kcal').textContent = `🔥 ${m.calories}`;
    $('empty').hidden = !!m; list.hidden = !m;
    if (!m) {
      $('empty').textContent = emptyMessage();
      return;
    }
    for (const meal of m.meals) {
      const row = el('div', 'item'), info = el('div', 'info'); row.setAttribute('data-cat', meal.category);
      const cat = CATS.find((c) => c[0] === meal.category);
      info.append(el('div', 'cat', cat ? cat[1] : meal.category), el('div', 'name', meal.name));
      if (meal.note) info.append(el('span', 'badge', `📍 ${meal.note}`));
      row.append(el('div', 'ico', icon(meal.name)), info);
      list.append(row);
    }
  }

  function render() {
    $('banner').hidden = !(rerouted && selected !== istanbulNow().key);
    $('todayLabel').textContent = longDate(istanbulNow().key);
    renderStrip(); renderMenu();
    const parts = [];
    if (updated) parts.push('Menü güncellendi: ' + new Date(updated).toLocaleString('tr-TR', { timeZone: TZ, day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }));
    if (keys().length) parts.push(`${keys().length} gün`);
    $('foot').textContent = parts.join(' · ');
  }

  /* ---------- Gezinme ---------- */
  const firstInWeek = (mon) => { for (let i = 0; i < 5; i++) if (menus[addDays(mon, i)]) return addDays(mon, i); return mon; };
  function bounds() { const k = keys(); return k.length ? [toTime(k[0]), toTime(k[k.length - 1])] : null; }
  function weekOk(dir) {
    const b = bounds(); if (!b) return true;
    const t = toTime(addDays(weekStart, 7 * dir));
    return t + 4 * 86400000 >= b[0] && t <= b[1];
  }
  function stepWeek(dir) {
    if (!weekOk(dir)) return false;
    weekStart = addDays(weekStart, 7 * dir); selected = firstInWeek(weekStart); rerouted = false; render(); return true;
  }
  function stepDay(dir) {
    const b = bounds(); if (!b) return false;
    let n = selected;
    do { n = addDays(n, dir); } while ([0, 6].includes(dow(n)));
    if (toTime(n) < b[0] || toTime(n) > b[1]) return false;
    selected = n; weekStart = mondayOf(n); rerouted = false; render(); return true;
  }
  $('prevWeek').onclick = () => stepWeek(-1);
  $('nextWeek').onclick = () => stepWeek(1);

  // Parmakla (veya fareyle) kaydırma
  let swipedAt = 0;
  document.addEventListener('click', (e) => { if (Date.now() - swipedAt < 350) { e.stopPropagation(); e.preventDefault(); } }, true);

  function makeSwipeable(box, onSwipe) {
    let x0 = 0, y0 = 0, t0 = 0, dx = 0, dir = null, down = false;
    const slide = (cls) => { box.classList.remove('slide-l', 'slide-r'); void box.offsetWidth; box.classList.add(cls); };
    const start = (x, y) => { down = true; x0 = x; y0 = y; t0 = Date.now(); dx = 0; dir = null; box.style.transition = 'none'; };
    const move = (x, y, ev) => {
      if (!down) return;
      const mx = x - x0, my = y - y0;
      if (dir === null && (Math.abs(mx) > 6 || Math.abs(my) > 6)) dir = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
      if (dir === 'x') {
        dx = mx; box.style.transform = `translateX(${dx * 0.35}px)`;
        if (ev && ev.cancelable) ev.preventDefault(); // yatay harekette sayfa kaymasın
      }
    };
    const end = () => {
      if (!down) return;
      down = false;
      box.style.transition = 'transform .18s'; box.style.transform = '';
      const fast = Math.abs(dx) > 25 && Math.abs(dx) / Math.max(1, Date.now() - t0) > 0.4; // hızlı fiske
      if (dir === 'x' && Math.abs(dx) > 8) swipedAt = Date.now();
      if (dir === 'x' && (Math.abs(dx) > 45 || fast) && onSwipe(dx < 0 ? 1 : -1)) slide(dx < 0 ? 'slide-l' : 'slide-r');
      dir = null;
    };
    // Dokunmatik ekran
    box.addEventListener('touchstart', (e) => { if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY); else down = false; }, { passive: true });
    box.addEventListener('touchmove', (e) => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
    box.addEventListener('touchend', end);
    box.addEventListener('touchcancel', end);
    // Fare (bilgisayarda denemek için)
    box.addEventListener('mousedown', (e) => { if (e.button === 0) start(e.clientX, e.clientY); });
    document.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
    document.addEventListener('mouseup', end);
  }
  makeSwipeable(document.querySelector('main'), stepDay);   // menü alanı: gün gün
  makeSwipeable($('strip'), stepWeek);                       // gün şeridi: hafta hafta
  $('bannerBtn').onclick = () => { selected = istanbulNow().key; weekStart = mondayOf(selected); rerouted = false; render(); };

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isIOS && !window.navigator.standalone && !store(() => localStorage.getItem(LS.hint))) 
  $('installClose').onclick = () => { $('install').hidden = true; store(() => localStorage.setItem(LS.hint, '1')); };

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { initialSelection(); render(); load(); }
  });

  const parseText = (t) => P.parseMenu(t);

  function apply(text, modified, first) {
    rawText = text; menus = parseText(text); updated = modified || null;
    if (first || !menus[selected]) initialSelection();
    render();
  }

  async function load() {
    // 1) Anında: son kaydedilen kopya
    const c = store(() => JSON.parse(localStorage.getItem(LS.data)));
    if (c && typeof c.text === 'string') apply(c.text, c.modified, true); else { initialSelection(); render(); }
    // 2) Güncel dosya (SW: önce ağ, çevrimdışıysa önbellek)
    try {
      const res = await fetch(SRC, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const modified = res.headers.get('last-modified') ? new Date(res.headers.get('last-modified')).toISOString() : (c && c.modified) || null;
      if (!c || c.text !== text) {
        store(() => localStorage.setItem(LS.data, JSON.stringify({ text, modified })));
        apply(text, modified, !c);
      } else if (modified !== c.modified) { updated = modified; render(); }
    } catch (e) { loadInfo = (e && e.message) || String(e); }
    loading = false; render();
  }

  if ('serviceWorker' in navigator) {
    // Yeni sürüm devreye girince sayfayı bir kez yenile (ilk kurulumda yenileme yok)
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  load();
})();
</script>
<script src="haptics.js"></script>
<script src="hub.js"></script>
<script src="game.js"></script>
<script src="sudoku.js"></script>
